[package]
name = "vispyx-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional Rust backend for the vispyx morphology engine"
readme = "README.md"

[lib]
name = "vispyx_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
