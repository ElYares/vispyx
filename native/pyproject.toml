[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vispyx-native"
version = "0.1.0"
description = "Optional Rust backend for the vispyx morphology engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "elyarestark" }]
keywords = ["image-processing", "morphology", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy"]

[tool.maturin]
module-name = "vispyx_native"
features = ["pyo3/extension-module"]
